name: Sync TanStack Query React v5 Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-upstream.yml'
      - 'scripts/**'
  schedule:
    - cron: '20 3 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Check upstream ref
        id: upstream
        run: node scripts/check-upstream-update.mjs --github-output

      - name: Keep scheduled workflow active
        if: steps.upstream.outputs.has_update != 'true'
        env:
          SKIP_SIMPLE_GIT_HOOKS: 1
        run: |
          file=.github/sync-keepalive
          if [[ -f "$file" ]]; then
            age=$(( ($(date -u +%s) - $(date -u -d "$(cat "$file")" +%s)) / 86400 ))
            if (( age < 30 )); then exit 0; fi
          fi
          date -u +'%Y-%m-%dT%H:%M:%SZ' > "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'chore: keep sync workflow active [skip ci]'
          git push origin HEAD:main

      - name: Setup pnpm
        if: steps.upstream.outputs.has_update == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Install dependencies
        if: steps.upstream.outputs.has_update == 'true'
        run: pnpm install --frozen-lockfile

      - name: Sync upstream docs
        if: steps.upstream.outputs.has_update == 'true'
        run: pnpm run sync:docs

      - name: Validate candidate
        if: steps.upstream.outputs.has_update == 'true'
        id: validation
        shell: bash
        run: |
          # Run all checks and retain diagnostics even when translations need work.
          ready=true
          for command in check lint i18n:check test:maintenance build links:check; do
            log="$RUNNER_TEMP/check-${command//:/-}.log"
            if ! pnpm run "$command" > "$log" 2>&1; then
              ready=false
              cat "$log"
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          {
            echo 'Automated sync from upstream TanStack Query main.'
            echo
            node --input-type=module -e 'import { readFileSync } from "node:fs"; const lock = JSON.parse(readFileSync("upstream/lock.json")); console.log(`Upstream commit: ${lock.commit}`)'
            echo
            echo "All validation checks passed: $ready"
            echo
            echo 'Translations must be reviewed before updating their source hashes.'
            echo
            echo '```text'
            pnpm run i18n:status
            echo '```'
          } > "$RUNNER_TEMP/sync-pr-body.md"
          cat "$RUNNER_TEMP/sync-pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Push validated sync to main
        if: steps.upstream.outputs.has_update == 'true' && steps.validation.outputs.ready == 'true'
        id: publish
        env:
          SKIP_SIMPLE_GIT_HOOKS: 1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/docs upstream
          if git diff --cached --quiet; then
            echo 'pushed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'chore: sync TanStack Query React v5 docs'
          if git push origin HEAD:main; then
            echo 'pushed=true' >> "$GITHUB_OUTPUT"
          else
            # Protected branches or concurrent changes fall back to a reviewable PR.
            echo 'pushed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update translation PR
        if: steps.upstream.outputs.has_update == 'true' && steps.publish.outputs.pushed != 'true'
        env:
          SKIP_SIMPLE_GIT_HOOKS: 1
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          commit-message: 'chore: sync TanStack Query React v5 docs'
          branch: chore/sync-query-react-v5-docs
          title: 'chore: sync TanStack Query React v5 docs'
          body-path: ${{ runner.temp }}/sync-pr-body.md
          add-paths: |
            src/content/docs
            upstream

      - name: Upload validation diagnostics
        if: always() && steps.upstream.outputs.has_update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sync-validation
          path: ${{ runner.temp }}/check-*.log
